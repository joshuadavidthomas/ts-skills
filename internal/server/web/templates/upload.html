{{define "content"}}
<main class="mx-auto w-full max-w-5xl flex-1 px-4 py-6">
  <div class="mb-6">
    <h2 class="text-2xl font-semibold text-gray-800">Upload a skill</h2>
    <p class="mt-1 text-sm text-gray-500">Uploads are staged for review and are never run.</p>
  </div>
  <form id="upload-form" class="max-w-2xl space-y-6">
    <div>
      <label for="namespace" class="block text-sm font-medium text-gray-800">Namespace</label>
      <p id="namespace-help" class="mt-1 text-sm text-gray-500">The group that owns this skill, such as <span class="font-mono">team</span>.</p>
      <input id="namespace" name="namespace" required maxlength="256" aria-describedby="namespace-help" class="mt-2 w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-gray-800 hover:border-gray-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30">
    </div>
    <div>
      <span class="block text-sm font-medium text-gray-800">Skill files</span>
      <p id="source-help" class="mt-1 text-sm text-gray-500">One skill directory containing <span class="font-mono">SKILL.md</span>.</p>
      <button type="button" id="dropzone" aria-describedby="source-help" class="mt-2 w-full rounded-md border border-dashed border-gray-300 px-4 py-8 text-center hover:border-gray-400 hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2">
        <span class="block text-sm font-medium text-gray-800">Drop a skill directory here</span>
        <span class="mt-1 block text-sm text-gray-500">or click to choose one</span>
        <span id="source-summary" aria-live="polite" class="mt-3 block text-sm text-gray-500">Nothing selected yet.</span>
      </button>
      <input type="file" id="directory" webkitdirectory multiple hidden aria-hidden="true" tabindex="-1">
    </div>
    <div class="flex flex-wrap items-center gap-4">
      <button type="submit" class="rounded-md bg-blue-500 px-4 py-2 text-sm font-medium text-white hover:bg-blue-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2">Stage for review</button>
      <p id="upload-status" role="status" aria-live="polite" class="text-sm text-gray-500"></p>
    </div>
  </form>
</main>
<script src="/static/upload.js" defer></script>
{{end}}
