{{define "upload"}}
{{template "head" .}}
<meta name="csrf-token" content="{{.CSRFToken}}">
{{template "header" .}}
<main class="mx-auto w-full max-w-5xl flex-1 px-4 py-6">
  <div class="mb-6">
    <h2 class="text-2xl font-semibold text-gray-800">Upload a skill</h2>
    <p class="mt-1 text-sm text-gray-500">Choose one ZIP file or one directory. Uploaded files are stored for review and are never run.</p>
  </div>
  <form id="upload-form" class="max-w-2xl space-y-6 rounded-lg border border-gray-200 bg-white p-6">
    <div>
      <label for="namespace" class="block text-sm font-medium text-gray-800">Namespace</label>
      <p id="namespace-help" class="mt-1 text-sm text-gray-500">The group that owns this skill, such as <span class="font-mono">team</span>.</p>
      <input id="namespace" name="namespace" required maxlength="256" aria-describedby="namespace-help" class="mt-2 w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-gray-800 hover:border-gray-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30">
    </div>
    <fieldset>
      <legend class="text-sm font-medium text-gray-800">Upload type</legend>
      <div class="mt-2 grid gap-3 sm:grid-cols-2">
        <label class="flex cursor-pointer items-start gap-3 rounded-md border border-gray-300 p-3 hover:bg-gray-100">
          <input type="radio" name="kind" value="zip" checked class="mt-0.5 size-4 accent-blue-500">
          <span><span class="block text-sm font-medium text-gray-800">ZIP</span><span class="block text-sm text-gray-500">Upload one archive.</span></span>
        </label>
        <label class="flex cursor-pointer items-start gap-3 rounded-md border border-gray-300 p-3 hover:bg-gray-100">
          <input type="radio" name="kind" value="directory" class="mt-0.5 size-4 accent-blue-500">
          <span><span class="block text-sm font-medium text-gray-800">Directory</span><span class="block text-sm text-gray-500">Choose a folder from this device.</span></span>
        </label>
      </div>
    </fieldset>
    <div class="grid gap-5 sm:grid-cols-2">
      <label for="archive" class="block text-sm font-medium text-gray-800">ZIP file
        <input type="file" id="archive" accept=".zip,application/zip" class="mt-2 block w-full rounded-md border border-gray-300 bg-white text-sm text-gray-500 file:mr-3 file:border-0 file:border-r file:border-gray-300 file:bg-gray-100 file:px-3 file:py-2 file:font-medium file:text-gray-800 hover:file:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500/30">
      </label>
      <label for="directory" class="block text-sm font-medium text-gray-800">Directory
        <input type="file" id="directory" webkitdirectory multiple class="mt-2 block w-full rounded-md border border-gray-300 bg-white text-sm text-gray-500 file:mr-3 file:border-0 file:border-r file:border-gray-300 file:bg-gray-100 file:px-3 file:py-2 file:font-medium file:text-gray-800 hover:file:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500/30">
      </label>
    </div>
    <div class="flex flex-wrap items-center gap-4">
      <button type="submit" class="rounded-md bg-blue-500 px-4 py-2 text-sm font-medium text-white hover:bg-blue-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2">Stage for review</button>
      <p id="upload-status" role="status" aria-live="polite" class="text-sm text-gray-500"></p>
    </div>
  </form>
</main>
<script src="/static/upload.js" defer></script>
{{template "footer" .}}
{{end}}
