{{define "error"}}
{{template "head" .Title}}
{{template "header" .}}
<main class="mx-auto flex w-full max-w-5xl flex-1 items-center justify-center px-4 py-12">
  <section class="max-w-lg text-center">
    <h2 class="text-2xl font-bold text-gray-800">{{.Title}}</h2>
    <p class="mt-2 text-gray-500">{{.Action}}</p>
    <a href="/" class="mt-5 inline-block rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-800 hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2">Back to catalog</a>
  </section>
</main>
{{template "footer" .}}
{{end}}
